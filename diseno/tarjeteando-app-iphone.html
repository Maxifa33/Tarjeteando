<style>
body{margin:0}

font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.mb.light{--base:#E9EBF2;--win:rgba(255,255,255,.74);--winBorder:rgba(255,255,255,.7);--solid:#FFFFFF;--label:#1D1D1F;--label2:#56565B;--sep:rgba(60,60,67,.18);--fill:rgba(120,120,128,.14);--fill2:rgba(255,255,255,.55);--track:rgba(120,120,128,.14);--r1:#2B2A7A;--r2:#4F4DD6;--r3:#8C8AE8;--t1:#FFFFFF;--t3:#1D1D1F;--danger:#D70015;--ok:#1F7A35;--blobOp:.45;--inv:#1D1D1F;--invText:#FFFFFF;--santander:#D6001C;--galv:#C2500A;--galmc:#B0126B;--bbva:#1B5FAF;--ch-santander:#D6001C;--ch-bbva:#1B5FAF;--ch-galv:#C2500A;--ch-galmc:#B0126B}

.mb button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left;-webkit-tap-highlight-color:transparent}
.mb button:focus-visible,.mb input:focus-visible{outline:2px solid var(--label);outline-offset:3px;border-radius:12px}
.mb .glass{background:var(--win);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:0.5px solid var(--winBorder);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 10px 30px rgba(0,0,0,.25)}
.mb.rt .glass{background:var(--solid);backdrop-filter:none;-webkit-backdrop-filter:none}
.mb .blob{position:absolute;left:0;top:0;width:300px;height:300px;border-radius:50%;filter:blur(60px);transition:transform 1.1s linear(0, .09 5.6%, .263 11.1%, .441 16.7%, .593 22.2%, .711 27.8%, .8 33.3%, .863 38.9%, .908 44.4%, .938 50%, .959 55.6%, .982 66.7%, .993 77.8%, .998 88.9%, 1),opacity .9s}

.mb .spr{transition:transform .6s linear(0, .09 5.6%, .263 11.1%, .441 16.7%, .593 22.2%, .711 27.8%, .8 33.3%, .863 38.9%, .908 44.4%, .938 50%, .959 55.6%, .982 66.7%, .993 77.8%, .998 88.9%, 1),width .6s linear(0, .09 5.6%, .263 11.1%, .441 16.7%, .593 22.2%, .711 27.8%, .8 33.3%, .863 38.9%, .908 44.4%, .938 50%, .959 55.6%, .982 66.7%, .993 77.8%, .998 88.9%, 1),left .6s linear(0, .09 5.6%, .263 11.1%, .441 16.7%, .593 22.2%, .711 27.8%, .8 33.3%, .863 38.9%, .908 44.4%, .938 50%, .959 55.6%, .982 66.7%, .993 77.8%, .998 88.9%, 1),height .5s linear(0, .09 5.6%, .263 11.1%, .441 16.7%, .593 22.2%, .711 27.8%, .8 33.3%, .863 38.9%, .908 44.4%, .938 50%, .959 55.6%, .982 66.7%, .993 77.8%, .998 88.9%, 1),opacity .25s,filter .3s}
.mb .enter{animation:mbIn .45s linear(0, .09 5.6%, .263 11.1%, .441 16.7%, .593 22.2%, .711 27.8%, .8 33.3%, .863 38.9%, .908 44.4%, .938 50%, .959 55.6%, .982 66.7%, .993 77.8%, .998 88.9%, 1) both}
@keyframes mbIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.mb .cap{font-size:12px;color:var(--label2);letter-spacing:.01em}
.mb h2{margin:0;font-size:20px;line-height:25px;font-weight:700;letter-spacing:-.01em}

.mb .seg button.on{background:var(--solid);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.mb .btn{height:44px;padding:0 16px;border-radius:22px;font-size:15px;font-weight:600;background:var(--fill)}

.mb .pl{position:absolute;left:0;width:358px;height:226px;border-radius:18px;box-sizing:border-box;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;isolation:isolate;box-shadow:0 -1px 0 rgba(255,255,255,.12) inset,0 -4px 18px rgba(0,0,0,.35)}

.mb .col.on{background:var(--fill)}

.mb .rail{position:absolute;bottom:30px;width:62px;border-radius:31px;overflow:hidden;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.mb .ritem{width:54px;height:54px;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;flex-shrink:0}
.mb .ritem.on{background:var(--fill)}
.mb .rlist{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:4px;transition:opacity .25s}
.mb .menu button{display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 12px;border-radius:10px;font-size:15px}
.mb{--warn:#FF9F0A}.mb.light{--warn:#B25000}
.mb .pchip{height:36px;padding:0 14px;border-radius:18px;font-size:14px;font-weight:500;background:var(--fill2);white-space:nowrap;display:flex;align-items:center;gap:6px;flex-shrink:0}
.mb .pchip.on{background:var(--inv);color:var(--invText);font-weight:600}
.mb .hs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.mb .mrow{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;border-bottom:0.5px solid var(--sep);font-size:15px}
.mb .mrow:last-child{border-bottom:0}

.mb .srch input{border:0;background:none;outline:none;font:inherit;color:var(--label);width:100%}
.mb .fld{height:44px;border-radius:12px;border:0;background:var(--fill);padding:0 12px;font:inherit;font-size:16px;color:var(--label);width:100%;box-sizing:border-box}

.mb .sheet{animation:mbSheet .5s linear(0, .09 5.6%, .263 11.1%, .441 16.7%, .593 22.2%, .711 27.8%, .8 33.3%, .863 38.9%, .908 44.4%, .938 50%, .959 55.6%, .982 66.7%, .993 77.8%, .998 88.9%, 1) both}
@keyframes mbSheet{from{transform:translateY(100%)}to{transform:none}}
.mb .toast{position:absolute;left:16px;right:16px;bottom:110px;z-index:60;padding:12px 16px;border-radius:16px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px}
@media (prefers-reduced-motion:reduce){.mb .sheet{animation:none}}
@media (prefers-reduced-motion:reduce){.mb .spr,.mb .blob,.mb .stack>div{transition:opacity .2s}.mb .enter{animation:none}}
@media (prefers-reduced-transparency:reduce){.mb .glass{background:var(--solid);backdrop-filter:none;-webkit-backdrop-filter:none}.mb .blob{opacity:0!important}}

const BOARDS = {"X":{"markup":"\u003cdiv class=\"mb {{modeCls}} {{rtCls}}\" style=\"width:390px;height:844px;position:relative;overflow:hidden;background:var(--base);color:var(--label)\">\n\n\u003cdiv aria-hidden=\"true\" style=\"position:absolute;inset:0;overflow:hidden\">\n\u003csc-for list=\"{{blobs}}\" as=\"b\" hint-placeholder-count=\"4\">\u003cdiv class=\"blob\" style=\"background:var(--{{b.key}});transform:translate({{b.x}}px,{{b.y}}px) scale({{b.s}});opacity:{{b.o}}\">\u003c/div>\u003c/sc-for>\n\u003c/div>\n\n\u003cmain style=\"position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:58px 16px 130px;box-sizing:border-box;scrollbar-width:none\">\n\n\u003cdiv style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:4px\">\n\u003cspan style=\"display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700\">\u003cspan style=\"position:relative;width:24px;height:18px\">\u003cspan style=\"position:absolute;left:0;top:0;width:18px;height:12px;border-radius:3px;background:linear-gradient(135deg,#C2185B,#6E0B3E)\">\u003c/span>\u003cspan style=\"position:absolute;left:6px;top:6px;width:18px;height:12px;border-radius:3px;background:linear-gradient(135deg,#D0021B,#7A0615)\">\u003c/span>\u003c/span>Tarjeteando\u003c/span>\n\u003cspan style=\"display:flex;gap:8px;position:relative\">\n\u003cbutton class=\"ico glass\" aria-label=\"Buscar\">\u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\u003ccircle cx=\"11\" cy=\"11\" r=\"7\">\u003c/circle>\u003cpath d=\"m21 21-4.3-4.3\">\u003c/path>\u003c/svg>\u003c/button>\n\u003cbutton class=\"ico glass\" aria-label=\"Apariencia y menú\" aria-expanded=\"{{menuExp}}\" onClick=\"{{toggleMenu}}\">\u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\">\u003c/circle>\u003cpath d=\"M12 3a9 9 0 0 0 0 18Z\" fill=\"currentColor\">\u003c/path>\u003c/svg>\u003c/button>\n\u003c/span>\n\u003c/div>\n\n\u003csc-if value=\"{{isMes}}\" hint-placeholder-val=\"{{true}}\">\n\u003csection class=\"enter\" style=\"display:flex;flex-direction:column;gap:18px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:2px;padding-top:10px\">\n\u003cspan style=\"font-size:13px;font-weight:600;color:var(--label2)\">Sábado 26 de septiembre\u003c/span>\n\u003ch1 style=\"margin:0;font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.02em\">{{v.titulo}}\u003c/h1>\n\u003c/div>\n\u003cdiv class=\"seg\" role=\"group\" aria-label=\"Período\">\u003cbutton class=\"{{v.ocCls}}\" onClick=\"{{verOct}}\">Este ciclo\u003c/button>\u003cbutton class=\"{{v.noCls}}\" onClick=\"{{verNov}}\">Próximo mes\u003c/button>\u003c/div>\n\u003cp style=\"margin:0;font-size:20px;line-height:27px;letter-spacing:-.01em;color:var(--label2)\">{{v.frase1}} \u003cstrong style=\"color:var(--label);font-weight:600\">{{v.fraseNum}}\u003c/strong> {{v.frase2}} \u003cstrong style=\"color:{{v.libreColor}};font-weight:700\">{{v.fraseLibre}}\u003c/strong>\u003c/p>\n\n\u003cdiv style=\"position:relative;height:48px;margin-top:6px\">\n\u003cdiv style=\"position:absolute;inset:0;border-radius:24px;background:var(--track)\">\u003c/div>\n\u003cdiv style=\"position:absolute;inset:0;display:flex;gap:2px;border-radius:24px;overflow:hidden\">\n\u003cdiv class=\"spr\" style=\"width:{{v.w1}}%;background:var(--r1)\">\u003c/div>\u003cdiv class=\"spr\" style=\"width:{{v.w2}}%;background:var(--r2)\">\u003c/div>\u003cdiv class=\"spr\" style=\"width:{{v.w3}}%;background:var(--r3)\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"spr\" style=\"position:absolute;top:-6px;bottom:-6px;left:{{v.topePct}}%;width:2px;margin-left:-1px;border-radius:1px;background:var(--label)\">\u003c/div>\n\u003c/div>\n\n\u003cdiv style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px\">\n\u003cdiv style=\"display:flex;flex-direction:column;gap:1px\">\u003cspan class=\"cap\" style=\"display:flex;align-items:center;gap:6px\">\u003cspan style=\"width:10px;height:10px;border-radius:3px;background:var(--r1)\">\u003c/span>Cuotas · firmadas\u003c/span>\u003cspan class=\"rnd\" style=\"font-size:17px;font-weight:600\">$&nbsp;{{v.a1}}\u003c/span>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:1px\">\u003cspan class=\"cap\" style=\"display:flex;align-items:center;gap:6px\">\u003cspan style=\"width:10px;height:10px;border-radius:3px;background:var(--r2)\">\u003c/span>Fijos · se repiten\u003c/span>\u003cspan class=\"rnd\" style=\"font-size:17px;font-weight:600\">$&nbsp;{{v.a2}}\u003c/span>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:1px\">\u003cspan class=\"cap\" style=\"display:flex;align-items:center;gap:6px\">\u003cspan style=\"width:10px;height:10px;border-radius:3px;background:var(--r3)\">\u003c/span>Variables · en curso\u003c/span>\u003cspan class=\"rnd\" style=\"font-size:17px;font-weight:600\">$&nbsp;{{v.a3}}\u003c/span>\u003c/div>\n\u003cdiv style=\"display:flex;flex-direction:column;gap:1px\">\u003cspan class=\"cap\" style=\"display:flex;align-items:center;gap:6px\">\u003cspan style=\"width:10px;height:10px;border-radius:3px;border:1.5px dashed var(--label2);box-sizing:border-box\">\u003c/span>{{v.libreLabel}}\u003c/span>\u003cspan class=\"rnd\" style=\"font-size:17px;font-weight:700;color:{{v.libreColor}}\">{{v.libreTxt}}\u003c/span>\u003c/div>\n\u003c/div>\n\u003clabel style=\"display:flex;flex-direction:column\">\u003cspan class=\"cap\" style=\"display:flex;justify-content:space-between\">\u003cspan>Tope mensual\u003c/span>\u003cspan style=\"font-weight:600;color:var(--label)\">$&nbsp;{{v.topeTxt}}\u003c/span>\u003c/span>\u003cinput type=\"range\" min=\"1000000\" max=\"3000000\" step=\"50000\" value=\"{{tope}}\" onChange=\"{{onTope}}\" aria-label=\"Tope mensual\">\u003c/label>\n\n\u003cdiv class=\"grp\" style=\"padding:16px;display:flex;flex-direction
