.tj.light{--warn:#B25000;--base:#E9EBF2;--win:rgba(255,255,255,.72);--winBorder:rgba(255,255,255,.65);--winHi:inset 0 1px 0 rgba(255,255,255,.8);--solid:#FFFFFF;--label:#1D1D1F;--label2:#56565B;--sep:rgba(60,60,67,.18);--fill:rgba(120,120,128,.14);--fill2:rgba(120,120,128,.09);--track:rgba(120,120,128,.14);--r1:#2B2A7A;--r2:#4F4DD6;--r3:#8C8AE8;--t1:#FFFFFF;--t2:#FFFFFF;--t3:#1D1D1F;--danger:#D70015;--ok:#1F7A35;--blobOp:.5;--inv:#1D1D1F;--invText:#FFFFFF;--santander:#D6001C;--galv:#C2500A;--galmc:#B0126B;--bbva:#1B5FAF}
.tj button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
.tj button:focus-visible,.tj input:focus-visible{outline:2px solid var(--label);outline-offset:3px;border-radius:12px}
.tj .glass{background:var(--win);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:0.5px solid var(--winBorder);box-shadow:var(--winHi),0 18px 50px rgba(0,0,0,.16);transition:background-color .4s}
.tj.rt .glass{background:var(--solid);backdrop-filter:none;-webkit-backdrop-filter:none}
.tj .blob{position:absolute;left:0;top:0;width:600px;height:600px;border-radius:50%;filter:blur(80px);transition:transform 1.1s linear(0, .09 5.6%, .263 11.1%, .441 16.7%, .593 22.2%, .711 27.8%, .8 33.3%, .863 38.9%, .908 44.4%, .938 50%, .959 55.6%, .982 66.7%, .993 77.8%, .998 88.9%, 1),opacity .9s}

.tj .spr{transition:transform .6s linear(0, .09 5.6%, .263 11.1%, .441 16.7%, .593 22.2%, .711 27.8%, .8 33.3%, .863 38.9%, .908 44.4%, .938 50%, .959 55.6%, .982 66.7%, .993 77.8%, .998 88.9%, 1),width .6s linear(0, .09 5.6%, .263 11.1%, .441 16.7%, .593 22.2%, .711 27.8%, .8 33.3%, .863 38.9%, .908 44.4%, .938 50%, .959 55.6%, .982 66.7%, .993 77.8%, .998 88.9%, 1),left .6s linear(0, .09 5.6%, .263 11.1%, .441 16.7%, .593 22.2%, .711 27.8%, .8 33.3%, .863 38.9%, .908 44.4%, .938 50%, .959 55.6%, .982 66.7%, .993 77.8%, .998 88.9%, 1),opacity .3s,filter .3s}
.tj .enter{animation:tjIn .5s linear(0, .09 5.6%, .263 11.1%, .441 16.7%, .593 22.2%, .711 27.8%, .8 33.3%, .863 38.9%, .908 44.4%, .938 50%, .959 55.6%, .982 66.7%, .993 77.8%, .998 88.9%, 1) both}

.tj .rnd{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
.tj .cap{font-size:12px;color:var(--label2);letter-spacing:.01em}
.tj h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--label2);text-transform:uppercase}
.tj .tab{height:40px;padding:0 18px;border-radius:20px;font-size:15px;font-weight:500;display:flex;align-items:center}
.tj .tab:hover{background:var(--fill2)}
.tj .tab.on{background:var(--fill);font-weight:600}
.tj .ico{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center}
.tj .seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--fill)}
.tj .seg button{height:32px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:500}
.tj .seg button.on{background:var(--solid);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tj .row{display:flex;align-items:center;gap:10px;min-height:40px;border-bottom:0.5px solid var(--sep);font-size:14px}
.tj .rowbtn{width:100%;border-radius:10px}
.tj .rowbtn:hover{background:var(--fill2)}
.tj .chip{display:inline-block;width:22px;height:14px;border-radius:3.5px;flex-shrink:0;box-shadow:inset 0 0 0 0.5px rgba(255,255,255,.25)}
.tj .btn{height:36px;padding:0 14px;border-radius:18px;font-size:14px;font-weight:600;background:var(--fill)}
.tj .btn.pri{background:var(--inv);color:var(--invText)}
.tj input[type=range]{width:100%;height:28px;accent-color:var(--r2);margin:0}
.tj .plastic{position:relative;width:400px;height:252px;border-radius:20px;box-sizing:border-box;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;isolation:isolate;box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 14px 36px rgba(0,0,0,.30)}

.tj .lift{transition:transform .35s linear(0, .263 11.1%, .593 22.2%, .8 33.3%, .908 44.4%, .959 55.6%, .993 77.8%, 1)}

.tj .menu button{display:flex;align-items:center;gap:10px;width:100%;height:40px;padding:0 12px;border-radius:10px;font-size:14px}
.tj .menu button:hover{background:var(--fill2)}
.tj{--ch-santander:#E8484E;--ch-bbva:#4C8FEA;--ch-galv:#D47A22;--ch-galmc:#E2589E}
.tj.light{--ch-santander:#D6001C;--ch-bbva:#1B5FAF;--ch-galv:#C2500A;--ch-galmc:#B0126B}
.tj main{scrollbar-width:thin;scrollbar-color:var(--fill) transparent}
.tj .col{position:absolute;top:0;border-radius:12px}
.tj .col:hover,.tj .col:focus-visible{background:var(--fill2)}
.tj .col.on{background:var(--fill)}
.tj .stack{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column-reverse;gap:2px;border-radius:4px 4px 0 0;overflow:hidden}
.tj .stack>div{flex-shrink:0;transition:height .6s linear(0, .09 5.6%, .263 11.1%, .441 16.7%, .593 22.2%, .711 27.8%, .8 33.3%, .863 38.9%, .908 44.4%, .938 50%, .959 55.6%, .982 66.7%, .993 77.8%, .998 88.9%, 1)}

.tj .tbl{width:100%;border-collapse:collapse;font-size:13px}
.tj .tbl th{font-weight:600;color:var(--label2);text-align:right;padding:6px 8px;border-bottom:0.5px solid var(--sep)}
.tj .tbl td{text-align:right;padding:6px 8px;border-bottom:0.5px solid var(--sep)}
.tj .tbl th:first-child,.tj .tbl td:first-child,.tj .tbl th:nth-child(2),.tj .tbl td:nth-child(2){text-align:left}
.tj .pchip{height:34px;padding:0 14px;border-radius:17px;font-size:13px;font-weight:500;background:var(--fill2);white-space:nowrap;display:flex;align-items:center;gap:6px}

.tj .pchip.on{background:var(--inv);color:var(--invText);font-weight:600}
.tj .mrow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 12px;border-radius:12px;font-size:15px}
.tj .mrow:hover{background:var(--fill2)}
.tj .mrow.on{background:var(--fill)}
.tj .tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--fill);white-space:nowrap;color:var(--label)}
.tj .tag.fijo{box-shadow:inset 0 0 0 1px var(--r2)}
.tj .tag.cuota{box-shadow:inset 0 0 0 1px var(--r1)}
.tj .tag.reint{box-shadow:inset 0 0 0 1px var(--ok)}
.tj .srch{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;background:var(--fill);color:var(--label2);font-size:15px}
.tj .srch input{border:0;background:none;outline:none;font:inherit;color:var(--label);width:100%}
.tj .insp{position:sticky;top:0;border-radius:24px;background:var(--fill2);padding:22px;display:flex;flex-direction:column;gap:16px}
.tj .fld{height:40px;border-radius:10px;border:0;background:var(--fill);padding:0 12px;font:inherit;font-size:15px;color:var(--label);width:100%;box-sizing:border-box}
.tj .prow{display:grid;grid-template-columns:300px minmax(0,1fr) 130px;align-items:center;gap:0;min-height:52px;width:100%;border-radius:12px;padding:0 10px;box-sizing:border-box}
.tj .prow:hover{background:var(--fill2)}
.tj .prow.on{background:var(--fill)}
.tj .seg2{position:absolute;top:50%;height:14px;margin-top:-7px}
.tj .toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;padding:12px 18px;border-radius:16px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px}
@media (prefers-reduced-motion:reduce){.tj .stack>div{transition:none}}
@media (prefers-reduced-motion:reduce){.tj .spr,.tj .lift,.tj .blob{transition:opacity .2s}.tj .enter{animation:none}}
@media (prefers-reduced-transparency:reduce){.tj .glass{background:var(--solid);backdrop-filter:none;-webkit-backdrop-filter:none}.tj .blob{opacity:0!important}}
@media (prefers-contrast:more){.tj .glass{background:var(--solid);border:1px solid var(--label2)}}
